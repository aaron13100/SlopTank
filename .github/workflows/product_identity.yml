# SlopTank modification notice: added or changed by SlopTank on 2026-07-23, 2026-09-09.
# A dedicated push caller instead of a job in push.yml: push.yml ignores
# markdown-only pushes, but README.md is one of the debrand guard's primary
# targets (upstream's h1, logo banner, and donate link live there), so this
# check must run on every push.
name: Product identity 🪪

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - release*

permissions:
  contents: read

jobs:
  product_identity:
    name: Product identity 🪪
    uses: ./.github/workflows/__product_identity.yml
    permissions:
      contents: read
    with:
      commit: ${{ github.sha }}
