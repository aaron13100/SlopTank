<div id="wizardStartPage" data-role="page" class="page standalonePage wizardPage" data-backbutton="false">
    <!-- SlopTank modification notice: added or changed by SlopTank on 2026-11-03. -->
    <div class="padded-left padded-right padded-top">
        <div class="ui-corner-all ui-shadow wizardContent" style="position:relative;">
            <form class="wizardStartForm">
                <p class="wizardStepIndicator">${WizardStepOneOfTwo}</p>
                <h1>${WizardCreateAdminTitle}</h1>
                <p>${WizardCreateAdminDescription}</p>

                <div class="inputContainer">
                    <input is="emby-input" type="text" id="txtUsername" autocomplete="username" label="${LabelUsername}" required="required" />
                </div>
                <div class="inputContainer">
                    <input is="emby-input" id="txtManualPassword" type="password" autocomplete="new-password" label="${LabelPassword}" required="required" />
                </div>
                <div class="inputContainer">
                    <input is="emby-input" id="txtPasswordConfirm" type="password" autocomplete="new-password" label="${LabelPasswordConfirm}" required="required" />
                </div>

                <p id="wizardStartError" class="wizardError hide" role="alert" aria-live="assertive"></p>
                <button is="emby-button" type="button" class="raised wizardRetryLoad hide">${WizardRetrySetupLoad}</button>

                <details class="wizardAdvancedOptions">
                    <summary>${WizardAdvancedSetup}</summary>
                    <p>${WizardAdvancedSetupDescription}</p>
                    <div class="inputContainer">
                        <input is="emby-input" type="text" id="txtServerName" label="${LabelServerName}" />
                        <div class="fieldDescription">${LabelServerNameHelp}</div>
                    </div>
                    <div class="selectContainer">
                        <select is="emby-select" id="selectLocalizationLanguage" label="${LabelPreferredDisplayLanguage}"></select>
                    </div>
                </details>

                <div class="wizardNavigation" style="text-align:right;">
                    <button is="emby-button" type="submit" class="raised button-submit">
                        <span>${WizardContinueToLibrary}</span>
                        <span class="material-icons arrow_forward" aria-hidden="true"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
