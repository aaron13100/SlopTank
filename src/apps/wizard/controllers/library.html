<div id="wizardLibraryPage" data-role="page" class="page standalonePage wizardPage mediaLibraryPage">
    <!-- SlopTank modification notice: added or changed by SlopTank on 2026-11-03. -->
    <div class="padded-left padded-right padded-top">
        <div class="ui-corner-all ui-shadow wizardContent">
            <div>
                <p class="wizardStepIndicator">${WizardStepTwoOfTwo}</p>
                <h1 style="display:inline-block;">${WizardChooseLibrariesTitle}</h1>
                <a href="https://jellyfin.org/docs/general/server/libraries" rel="noopener noreferrer" target="_blank" class="clearLink" style="margin-top:-10px;display:inline-block;vertical-align:middle;margin-left:2em;"><button is="emby-button" type="button" class="raised"><span class="material-icons info" aria-hidden="true"></span><span>${Help}</span></button></a>
            </div>
            <p>${WizardChooseLibrariesDescription}</p>
            <br />
            <div id="divVirtualFolders"></div>
            <p id="wizardLibraryError" class="wizardError hide" role="alert" aria-live="assertive"></p>
            <details class="wizardAdvancedOptions">
                <summary>${WizardAdvancedSetup}</summary>
                <p>${WizardQuickSetupSettingsNote}</p>
                <p><button is="emby-button" type="button" class="raised raised-alt" onclick="WizardLibraryPage.openMetadataPreferences();">${WizardMetadataPreferences}</button></p>
                <p><button is="emby-button" type="button" class="raised raised-alt" onclick="WizardLibraryPage.openRemoteAccessPreferences();">${WizardRemoteAccessPreferences}</button></p>
            </details>
            <br />
            <br />
            <div class="wizardNavigation">
                <button is="emby-button" type="button" class="raised button-cancel" onclick="history.back();">
                    <span class="material-icons arrow_back" aria-hidden="true"></span>
                    <span>${Previous}</span>
                </button>
                <button is="emby-button" type="button" class="raised button-submit" onclick="WizardLibraryPage.next();">
                    <span>${WizardStartWatching}</span>
                    <span class="material-icons check" aria-hidden="true"></span>
                </button>
            </div>
        </div>
    </div>
</div>
